"id":"u115","number":115,"chapter":"s27","words":["a60311d8add0","eb55ee822ec7","f0d408c96b0d","bceca08ed9e6","ee1a8c3321b5","8139a7eb5cfe","3ddb406db97d","b98356fe5010","66c99c6e2ee2","b2bdc49a81a1"],"ranks":[3]},{"id":"u116","number":116,"chapter":"s27","words":["c0241128b552","39cc27527fe0","537cabd4c9df","32d28a8f2bb9","079f1a44ba31","644fce20891b","0dd30d8910b8","4634d3bb0a49","b6c0737656b0","8d832ebb564b"],"ranks":[3]},{"id":"u117","number":117,"chapter":"s27","words":["07d945bbc03f","5e382ece231e","2539327207b7","eb5b9b978993","96ec14db12a0","a6403163f83e","5f908b1d217e","64875a4b6bd6","4afbdd4c1fee"],"ranks":[3,2]}],"groups":[{"id":"A","title":"展会与初次接待"},{"id":"B","title":"没听清、数字与单位"},{"id":"C","title":"拿着样品核对规格"},{"id":"D","title":"五金与工具选货"},{"id":"E","title":"水暖、电工与建材选货"},{"id":"F","title":"坐下来谈生意"},{"id":"G","title":"仓库、工厂与验货"},{"id":"H","title":"售后与复购"}],"dialogues":[{"id":"d01","number":1,"title":"展位前打招呼","rank":3,"group":"A","scene":"客户在展位门口停下，正在看展示架。先打招呼，再问他需要什么。","vocab":"booth＝展位；hardware＝五金；building materials＝建材；supplier＝供应商。","practice":"指着你家的两种主营产品，把最后一句中的 screws 和 door handles 换掉。","lines":[{"role":"老板","en":"Hi! Welcome to our **booth**.","zh":"您好！欢迎来到我们的展位。"},{"role":"客户","en":"Hello. Do you sell **hardware**?","zh":"你好，你们卖五金吗？"},{"role":"老板","en":"Yes. We supply hardware and **building materials**.","zh":"卖的。我们供应五金和建材。"},{"role":"客户","en":"Good. I'm looking for a new **supplier**.","zh":"很好，我正在找新的供应商。"},{"role":"老板","en":"What products are you looking for?","zh":"您在找哪些产品？"},{"role":"客户","en":"Mainly screws and door handles.","zh":"主要是螺丝和门把手。"}]},{"id":"d02","number":2,"title":"是工厂还是贸易公司","rank":3,"group":"A","scene":"客户坐下来，先了解你们的经营方式。按自己真实身份回答。","vocab":"manufacturer＝制造商；trading company＝贸易公司；factory＝工厂；source＝寻找货源、采购。","practice":"如果确实有自家工厂，可把第二句换为 “We're a manufacturer. Our factory is in [城市].”","lines":[{"role":"客户","en":"Are you a **manufacturer** or a **trading company**?","zh":"你们是制造商还是贸易公司？"},{"role":"老板","en":"We're a trading company. We work with several **factories**.","zh":"我们是贸易公司，与几家工厂合作。"},{"role":"客户","en":"Can you **source** different products for us?","zh":"你们能帮我们采购不同的产品吗？"},{"role":"老板","en":"Yes. What product categories do you need?","zh":"可以。您需要哪些产品类别？"},{"role":"客户","en":"Fasteners, plumbing fittings, and hand tools.","zh":"紧固件、水暖管件和手动工具。"},{"role":"老板","en":"We supply those. Let me show you some samples.","zh":"这些我们都有供应。我给您看些样品。"}]},{"id":"d03","number":3,"title":"客户究竟要找什么","rank":3,"group":"A","scene":"客户只说想找一些五金，你一边问，一边把样品拿到桌上。","vocab":"product range＝产品范围；main products＝主要产品；fastener＝紧固件；door hardware＝门用五金；hand tools＝手动工具。","practice":"用 “Our main products are…” 介绍你家最常卖的三个品类。","lines":[{"role":"客户","en":"What's your **product range**?","zh":"你们经营哪些产品？"},{"role":"老板","en":"Our **main products** are **fasteners** and **door hardware**.","zh":"我们主要经营紧固件和门用五金。"},{"role":"客户","en":"Do you also have **hand tools**?","zh":"你们也有手动工具吗？"},{"role":"老板","en":"Yes. Which tools do you need?","zh":"有，您需要哪些工具？"},{"role":"客户","en":"Wrenches and pliers.","zh":"扳手和钳子。"},{"role":"老板","en":"They're over here. Please have a look.","zh":"在这边，您看看。"}]},{"id":"d04","number":4,"title":"拿着纸质目录选产品","rank":3,"group":"A","scene":"两人翻同一本纸质目录，用笔圈出产品。","vocab":"product catalog＝产品目录；item number＝货号；model＝型号；sample＝样品。","practice":"拿一张自家产品图片，指着它说货号，再拿实物说明一处区别。","lines":[{"role":"老板","en":"Here's our **product catalog**.","zh":"这是我们的产品目录。"},{"role":"客户","en":"I like this one. What's the **item number**?","zh":"我喜欢这个，货号是什么？"},{"role":"老板","en":"It's H-208. This is the **sample**.","zh":"是 H-208。这是样品。"},{"role":"客户","en":"Is this the same **model** as the one in the picture?","zh":"这和图片里的是同一个型号吗？"},{"role":"老板","en":"Yes, but the sample has a different finish.","zh":"是同一型号，但样品的表面处理不同。"},{"role":"客户","en":"I see. Let me mark that in the catalog.","zh":"明白了，我在目录上标一下。"}]},{"id":"d05","number":5,"title":"了解客户的生意","rank":3,"group":"A","scene":"正式推荐产品前，先聊聊客户卖给谁。","vocab":"wholesaler＝批发商；retailer＝零售商；contractor＝承包商；customer＝客户；market＝市场。","practice":"把客户身份换成 retailer 或 distributor（经销商），再重新问答。","lines":[{"role":"老板","en":"Are you a **wholesaler** or a **retailer**?","zh":"您是做批发还是零售的？"},{"role":"客户","en":"We're a wholesaler. Most of our **customers** are **contractors**.","zh":"我们做批发，大部分客户是承包商。"},{"role":"老板","en":"What kinds of projects do they work on?","zh":"他们主要做哪类工程？"},{"role":"客户","en":"Homes and small shops.","zh":"住宅和小型商铺。"},{"role":"老板","en":"Which **market** do you serve?","zh":"您主要做哪个市场？"},{"role":"客户","en":"Mainly our local market in Kenya.","zh":"主要是肯尼亚当地市场。"}]},{"id":"d06","number":6,"title":"交换名片，确认姓名","rank":3,"group":"A","scene":"递名片，看看名字，确认怎么称呼对方。","vocab":"business card＝名片；company name＝公司名称；purchasing manager＝采购经理；contact details＝联系方式。","practice":"拿一张真实名片，指出姓名、公司名称和职位，用英文各说一次。","lines":[{"role":"老板","en":"Here's my **business card**.","zh":"这是我的名片。"},{"role":"客户","en":"Thank you. Here's mine.","zh":"谢谢，这是我的。"},{"role":"老板","en":"How do you pronounce your name?","zh":"您的名字怎么读？"},{"role":"客户","en":"It's Daniel. I'm the **purchasing manager**.","zh":"我叫 Daniel，是采购经理。"},{"role":"老板","en":"Nice to meet you, Daniel. Is this your **company name**?","zh":"很高兴认识您，Daniel。这是贵公司的名称吗？"},{"role":"客户","en":"Yes. Our **contact details** are on the back.","zh":"是的，联系方式在背面。"}]},{"id":"d07","number":7,"title":"带客户去展厅，约好见面时间","rank":3,"group":"A","scene":"展位样品有限，客户想去附近展厅看更多款式。","vocab":"showroom＝展厅；appointment＝预约；meeting＝会面；address＝地址；schedule＝日程、安排。","practice":"把时间换成下午两点半，说出你家展厅或门店的实际位置。","lines":[{"role":"客户","en":"Do you have a **showroom**?","zh":"你们有展厅吗？"},{"role":"老板","en":"Yes. It's about ten minutes from here by car.","zh":"有，开车过去大约十分钟。"},{"role":"客户","en":"Could we arrange a **meeting** there tomorrow?","zh":"我们能约明天在那里见面吗？"},{"role":"老板","en":"Let me check my **schedule**. Would ten in the morning work?","zh":"我看一下日程，上午十点方便吗？"},{"role":"客户","en":"Yes. Let's make an **appointment** for ten.","zh":"方便，我们约十点。"},{"role":"老板","en":"Great. I'll write down the **address**. Let's meet at the entrance.","zh":"好，我把地址写下来。我们在入口处见。"}]},{"id":"d08","number":8,"title":"坐下来喝点东西，开始聊天","rank":3,"group":"A","scene":"客户走累了，坐下来喝水聊天。轻松开口，再自然转入生意。","vocab":"trade fair＝展会；visit＝参观、来访；main products＝主要产品。tea、coffee、water 是配套日常用词。","practice":"不看英文，连续说出“请坐”“喝点什么”“您主要想看什么”。","lines":[{"role":"老板","en":"Please have a seat. Would you like tea, coffee, or water?","zh":"请坐。您想喝茶、咖啡还是水？"},{"role":"客户","en":"Water, please. It's been a busy morning.","zh":"水就好，谢谢。今天上午挺忙的。"},{"role":"老板","en":"Is this your first time at this **trade fair**?","zh":"您是第一次来这个展会吗？"},{"role":"客户","en":"No, I came last year too.","zh":"不是，去年也来了。"},{"role":"老板","en":"What would you like to see during your **visit**?","zh":"这次来您主要想看些什么？"},{"role":"客户","en":"Your **main products**, especially door hardware.","zh":"你们的主要产品，特别是门用五金。"}]},{"id":"d09","number":9,"title":"请说慢一点，再说一遍","rank":3,"group":"B","scene":"展馆有点吵，客户说得快，你只听清了一部分。","vocab":"quantity＝数量；size＝尺寸；repeat＝重复；confirm＝确认。","practice":"家人快速说一串尺寸和数量，你练习打断、请对方说慢、复述三个动作。","lines":[{"role":"客户","en":"We need three sizes, two thousand of each, by the end of next month.","zh":"我们要三种尺寸，每种两千件，下个月底前要。"},{"role":"老板","en":"Sorry, could you speak a little more slowly?","zh":"不好意思，您能说慢一点吗？"},{"role":"客户","en":"Of course. We need three **sizes**.","zh":"当然。我们要三种尺寸。"},{"role":"老板","en":"And could you **repeat** the **quantity** for each size?","zh":"每种尺寸的数量能再说一遍吗？"},{"role":"客户","en":"Two thousand pieces of each.","zh":"每种两千件。"},{"role":"老板","en":"Let me **confirm**: three sizes, two thousand pieces each.","zh":"我确认一下：三种尺寸，每种两千件。"},{"role":"客户","en":"That's right.","zh":"对。"}]},{"id":"d10","number":10,"title":"十五还是五十","rank":3,"group":"B","scene":"客户正在报数量，你拿笔当面写下数字。","vocab":"quantity＝数量；piece＝件；carton＝纸箱；total＝总数、合计。","practice":"把 fifty 换成 thirty，再算出 30 箱、每箱 200 件的总数并说出来。","lines":[{"role":"客户","en":"We'd like fifty **cartons**.","zh":"我们想要五十箱。"},{"role":"老板","en":"Sorry, fifteen or fifty?","zh":"不好意思，十五还是五十？"},{"role":"客户","en":"Fifty. Five-zero.","zh":"五十，五、零。"},{"role":"老板","en":"Fifty cartons. How many **pieces** per carton?","zh":"五十箱。每箱多少件？"},{"role":"客户","en":"Two hundred.","zh":"两百件。"},{"role":"老板","en":"So the **total quantity** is ten thousand pieces.","zh":"那么总数量是一万件。"},{"role":"客户","en":"Exactly.","zh":"没错。"}]},{"id":"d11","number":11,"title":"一件、一套，还是一箱","rank":3,"group":"B","scene":"客户说要“一百”，你先确认数量单位。","vocab":"piece＝件；set＝套；pair＝一对；carton＝纸箱；include＝包含。","practice":"拿一套真实产品，说明里面的部件，再说每箱能装多少套。","lines":[{"role":"客户","en":"I'll take a hundred.","zh":"我要一百。"},{"role":"老板","en":"A hundred **pieces** or a hundred **sets**?","zh":"一百件，还是一百套？"},{"role":"客户","en":"Sets. What does each set **include**?","zh":"套。每套包含什么？"},{"role":"老板","en":"One **pair** of handles and the fixing screws.","zh":"一对把手和安装螺丝。"},{"role":"客户","en":"How many sets are in a **carton**?","zh":"每箱多少套？"},{"role":"老板","en":"Twenty. So a hundred sets would be five cartons.","zh":"二十套。那么一百套就是五箱。"}]},{"id":"d12","number":12,"title":"毫米、厘米，还是英寸","rank":3,"group":"B","scene":"客户指着产品说“十二”，你不能直接按十二毫米理解。","vocab":"length＝长度；millimeter＝毫米；centimeter＝厘米；inch＝英寸；drawing＝图纸。","practice":"把十二厘米换成十五厘米，先说厘米，再说相应毫米数。","lines":[{"role":"客户","en":"I need a **length** of twelve.","zh":"我需要长度十二的。"},{"role":"老板","en":"Twelve **millimeters**, **centimeters**, or **inches**?","zh":"十二毫米、厘米，还是英寸？"},{"role":"客户","en":"Twelve centimeters.","zh":"十二厘米。"},{"role":"老板","en":"That's one hundred and twenty millimeters.","zh":"那就是一百二十毫米。"},{"role":"客户","en":"Yes. This is the **drawing**.","zh":"对，这是图纸。"},{"role":"老板","en":"Thanks. I'll mark the unit as millimeters here.","zh":"谢谢。我在这里标明单位是毫米。"}]},{"id":"d13","number":13,"title":"当面复述，确认没有听错","rank":3,"group":"B","scene":"客户说完要求，你用一句一句的短话复述，而不是只点头。","vocab":"confirm＝确认；material＝材质；finish＝表面处理、饰面；quantity＝数量；correct＝正确的。","practice":"故意把一个细节说错，让另一人纠正，再准确复述一遍。","lines":[{"role":"老板","en":"Let me **confirm** the details. The **material** is stainless steel?","zh":"我确认一下细节。材质是不锈钢，对吗？"},{"role":"客户","en":"Yes, grade 304.","zh":"对，304 的。"},{"role":"老板","en":"And the **finish** is polished?","zh":"表面是抛光的？"},{"role":"客户","en":"No, brushed, please.","zh":"不是，要拉丝的。"},{"role":"老板","en":"Brushed. And the **quantity** is five hundred pieces?","zh":"拉丝。数量是五百件？"},{"role":"客户","en":"That's **correct**.","zh":"对。"}]},{"id":"d14","number":14,"title":"技术问题暂时答不上来","rank":3,"group":"B","scene":"客户问到你不确定的性能，你请技术人员来一起看。","vocab":"working pressure＝工作压力；specification＝规格、技术要求；test report＝测试报告；double-check＝再次核对。","practice":"把 working pressure 换成 load capacity（承载能力），练习“先询问条件，再去核实”。","lines":[{"role":"客户","en":"What's the maximum **working pressure**?","zh":"最高工作压力是多少？"},{"role":"老板","en":"I'm not sure about this model. Let me check with our technician.","zh":"这个型号我还不确定，我问一下技术人员。"},{"role":"客户","en":"I need it for a hot-water system.","zh":"我要用于热水系统。"},{"role":"老板","en":"What temperature and pressure do you need?","zh":"您需要的温度和压力是多少？"},{"role":"客户","en":"They're listed in this **specification**.","zh":"都列在这份技术要求里。"},{"role":"老板","en":"Thank you. We'll **double-check** the model and its **test report**.","zh":"谢谢。我们会再次核对型号和它的测试报告。"},{"role":"客户","en":"All right. I'll look at the other samples while you check.","zh":"好，你们核对的时候，我先看看其他样品。"}]},{"id":"d15","number":15,"title":"用在哪里，室内还是室外","rank":3,"group":"C","scene":"客户拿起一个支架，你先问用途，再帮他缩小选择范围。","vocab":"application＝用途、应用；indoor＝室内的；outdoor＝室外的；load capacity＝承载能力；corrosion-resistant＝耐腐蚀的。","practice":"把场景改成室内仓库，用 indoor 回答，并说出一个需要进一步确认的条件。","lines":[{"role":"客户","en":"Which bracket would you suggest?","zh":"你建议哪种支架？"},{"role":"老板","en":"What's the **application**? Is it for **indoor** or **outdoor** use?","zh":"是什么用途？用于室内还是室外？"},{"role":"客户","en":"Shelves on an outside wall.","zh":"装在外墙上的置物架。"},{"role":"老板","en":"So it's for **outdoor** use. What **load capacity** do you need?","zh":"那就是室外用。您需要多大的承载能力？"},{"role":"客户","en":"About twenty kilograms per shelf.","zh":"每层置物架大约二十千克。"},{"role":"老板","en":"Let's check the wall material and mounting arrangement too. We can then look at **corrosion-resistant** options.","zh":"我们也核对一下墙体材料和安装方式，再看看耐腐蚀的选项。"}]},{"id":"d16","number":16,"title":"比较碳钢与不锈钢","rank":3,"group":"C","scene":"两个外观相近的配件放在桌上，客户问为什么价格不同。","vocab":"carbon steel＝碳钢；stainless steel＝不锈钢；grade＝牌号、等级；price difference＝价差；material certificate＝材质证明。","practice":"换成 brass（黄铜）和 zinc alloy（锌合金），用同样句型解释材质不同。","lines":[{"role":"客户","en":"These look the same. Why is there a **price difference**?","zh":"这两个看起来一样，为什么有价差？"},{"role":"老板","en":"This one is **carbon steel**. That one is **stainless steel**.","zh":"这个是碳钢，那个是不锈钢。"},{"role":"客户","en":"What **grade** of stainless steel?","zh":"什么牌号的不锈钢？"},{"role":"老板","en":"The label says 304. Let me check the **material certificate**.","zh":"标签上写的是 304，我核对一下材质证明。"},{"role":"客户","en":"Good. I need the material clearly stated on the order.","zh":"好，我需要在订单上写明材质。"},{"role":"老板","en":"Of course. We'll list the grade and the required standard.","zh":"当然，我们会列明牌号和要求采用的标准。"}]},{"id":"d17","number":17,"title":"材质和表面处理不是一回事","rank":3,"group":"C","scene":"客户看到银色配件，以为两个都是同一种材料。","vocab":"material＝材质；surface treatment＝表面处理；zinc-plated＝镀锌的；chrome-plated＝镀铬的；coating＝涂镀层。","practice":"拿两种自家产品，分别说 “The material is…” 和 “The surface treatment is…”。","lines":[{"role":"客户","en":"Is this made of zinc?","zh":"这是锌做的吗？"},{"role":"老板","en":"No. The **material** is steel. It's **zinc-plated**.","zh":"不是，材质是钢，表面镀锌。"},{"role":"客户","en":"So zinc is the **coating**?","zh":"所以锌是表面的镀层？"},{"role":"老板","en":"That's right. The **surface treatment** is different from the base material.","zh":"对，表面处理和基材是两回事。"},{"role":"客户","en":"What about this shiny one?","zh":"那这个亮亮的呢？"},{"role":"老板","en":"This one is brass and **chrome-plated**.","zh":"这个是黄铜材质，表面镀铬。"}]},{"id":"d18","number":18,"title":"用卷尺量长宽高","rank":3,"group":"C","scene":"客户问支架能不能放进现有安装位置，你拿出卷尺。","vocab":"tape measure＝卷尺；length＝长度；width＝宽度；height＝高度；dimensions＝各向尺寸。","practice":"随手量一个包装盒，用 “The length is… The width is… The height is…” 说出三个数。","lines":[{"role":"客户","en":"What are the **dimensions**?","zh":"它的尺寸是多少？"},{"role":"老板","en":"Let's check with a **tape measure**.","zh":"我们用卷尺量一下。"},{"role":"客户","en":"What's the **length**?","zh":"长度是多少？"},{"role":"老板","en":"Three hundred millimeters. The **width** is two hundred.","zh":"三百毫米，宽两百毫米。"},{"role":"客户","en":"And the **height**?","zh":"高度呢？"},{"role":"老板","en":"One hundred and fifty millimeters.","zh":"一百五十毫米。"}]},{"id":"d19","number":19,"title":"用卡尺量直径和厚度","rank":3,"group":"C","scene":"两人拿着一小段金属管，在样品桌边量尺寸。","vocab":"caliper＝卡尺；diameter＝直径；outside diameter＝外径；inside diameter＝内径；wall thickness＝壁厚。","practice":"指着管子外圈、内孔和管壁，分别说 outside diameter、inside diameter、wall thickness。","lines":[{"role":"客户","en":"Is the **diameter** twenty millimeters?","zh":"直径是二十毫米吗？"},{"role":"老板","en":"Do you mean the **outside diameter** or the **inside diameter**?","zh":"您指外径还是内径？"},{"role":"客户","en":"The outside diameter.","zh":"外径。"},{"role":"老板","en":"Let me measure it with the **caliper**. Yes, it's twenty.","zh":"我用卡尺量一下。对，是二十毫米。"},{"role":"客户","en":"What's the **wall thickness**?","zh":"壁厚是多少？"},{"role":"老板","en":"This sample is two millimeters thick.","zh":"这段样品的壁厚是两毫米。"}]},{"id":"d20","number":20,"title":"尺寸接近，还要核对公差","rank":2,"group":"C","scene":"客户拿卡尺测量配件，你们对照图纸判断尺寸是否符合要求。","vocab":"drawing＝图纸；tolerance＝公差；measurement＝测量值；out of tolerance＝超出公差；double-check＝再次核对。","practice":"一人说 “Plus or minus…”，另一人把公差写下来，再读回去确认。","lines":[{"role":"客户","en":"The **drawing** says ten millimeters, but this measures ten point zero five.","zh":"图纸上写十毫米，但这个量出来是十点零五。"},{"role":"老板","en":"What's the **tolerance** on the drawing?","zh":"图纸上的公差是多少？"},{"role":"客户","en":"Plus or minus zero point one millimeters.","zh":"正负零点一毫米。"},{"role":"老板","en":"Then this **measurement** is within that range.","zh":"那么这个测量值在这个范围内。"},{"role":"客户","en":"What if a piece is **out of tolerance**?","zh":"如果有一件超出公差呢？"},{"role":"老板","en":"We'll set it aside and **double-check** it.","zh":"我们会把它单独放好，再次核查。"}]},{"id":"d21","number":21,"title":"内丝、外丝和螺纹标准","rank":3,"group":"C","scene":"客户拿旧接头来配货，先看接口，再看规格。","vocab":"thread＝螺纹；male thread＝外螺纹；female thread＝内螺纹；BSPP＝英制平行管螺纹；NPT＝美制锥管螺纹；adapter＝转接头。","practice":"两手分别比画“外”和“内”，练习 “male on one end, female on the other”。","lines":[{"role":"客户","en":"I need an **adapter** like this.","zh":"我需要一个这样的转接头。"},{"role":"老板","en":"A **male thread** on this end and a **female thread** on the other?","zh":"这一端外螺纹，另一端内螺纹？"},{"role":"客户","en":"Yes. Half an inch on both ends.","zh":"对，两端都是半英寸。"},{"role":"老板","en":"What **thread** standard do you need? **BSPP** or **NPT**?","zh":"要什么螺纹标准？BSPP 还是 NPT？"},{"role":"客户","en":"I'm not sure. This is the old part.","zh":"我不确定，这是旧零件。"},{"role":"老板","en":"Let's check it before we choose a replacement.","zh":"我们先核对一下，再选替换件。"},{"role":"客户","en":"Good. I need it to match the existing pipe.","zh":"好，我需要它和原来的管子配套。"}]},{"id":"d22","number":22,"title":"对照色样选颜色与光泽","rank":3,"group":"C","scene":"把色板和两件样品并排放在自然光下，客户选择外观。","vocab":"color sample＝色样；matte＝哑光的；glossy＝亮光的；brushed finish＝拉丝表面；color difference＝色差。","practice":"找三种不同光泽或颜色的货，边指边说 matte、glossy、brushed。","lines":[{"role":"客户","en":"Do you have this in black?","zh":"这个有黑色的吗？"},{"role":"老板","en":"Yes. Would you like **matte** or **glossy** black?","zh":"有，您要哑光黑还是亮光黑？"},{"role":"客户","en":"Matte. Can I see a **color sample**?","zh":"哑光的。我能看看色样吗？"},{"role":"老板","en":"Here it is. This silver one has a **brushed finish**.","zh":"在这里。这个银色款是拉丝表面。"},{"role":"客户","en":"I prefer the matte black. Can we keep a sample to compare future orders?","zh":"我更喜欢哑光黑。能留一个样品，以后订单对照吗？"},{"role":"老板","en":"Certainly. We'll use the approved sample when checking for **color differences**.","zh":"当然。我们检查色差时会对照已确认样品。"}]},{"id":"d23","number":23,"title":"六角螺栓的规格和性能等级","rank":2,"group":"D","scene":"客户从螺栓样品盒里拿起一件，开始报规格。","vocab":"hex bolt＝六角头螺栓；property class＝性能等级；fully threaded＝全螺纹的；thread pitch＝螺距；standard＝标准。","practice":"把 M8 × 50 换成自家常卖规格，按“名称—尺寸—等级—牙型”口头确认。","lines":[{"role":"客户","en":"Do you have M8 by fifty **hex bolts**?","zh":"有 M8、长五十毫米的六角螺栓吗？"},{"role":"老板","en":"What **property class** do you need?","zh":"您要什么性能等级？"},{"role":"客户","en":"Eight point eight, **fully threaded**.","zh":"八点八级，全螺纹。"},{"role":"老板","en":"What **thread pitch** and **standard** are required?","zh":"要求的螺距和标准是什么？"},{"role":"客户","en":"They're on this drawing.","zh":"都在这张图纸上。"},{"role":"老板","en":"Thanks. Let me compare it with our sample.","zh":"谢谢，我和我们的样品对照一下。"}]},{"id":"d24","number":24,"title":"自攻螺丝还是钻尾螺丝","rank":2,"group":"D","scene":"客户把两种螺丝并排放，问它们有什么区别。","vocab":"self-tapping screw＝自攻螺钉；self-drilling screw＝自钻螺钉；head type＝头型；countersunk＝沉头的；Phillips＝十字槽。","practice":"一人问 head type，另一人回答 countersunk 或 pan head（盘头），再补充槽型。","lines":[{"role":"客户","en":"Are these both **self-tapping screws**?","zh":"这两种都是自攻螺丝吗？"},{"role":"老板","en":"This one is self-tapping. This one is **self-drilling**, with a drill point.","zh":"这个是自攻的。这个是自钻的，前端有钻尖。"},{"role":"客户","en":"I need the self-drilling type.","zh":"我要自钻的。"},{"role":"老板","en":"What material and thickness will you fasten?","zh":"您要固定什么材料，多厚？"},{"role":"客户","en":"Steel sheets. I'll show you the thickness requirement.","zh":"钢板。我给你看厚度要求。"},{"role":"老板","en":"And what **head type** do you need?","zh":"您要什么头型？"},{"role":"客户","en":"**Countersunk**, with a **Phillips** drive.","zh":"沉头，十字槽。"},{"role":"老板","en":"All right. Let's check that specification.","zh":"好，我们核对一下这个规格。"}]},{"id":"d25","number":25,"title":"给螺栓配螺母和垫圈","rank":2,"group":"D","scene":"客户拿一支螺栓来配螺母和垫圈，准备做成安装小包。","vocab":"bolt＝螺栓；hex nut＝六角螺母；flat washer＝平垫圈；lock nut＝锁紧螺母；set＝套。","practice":"拿实物排出一套，再把垫圈改成两个，说出每套完整配置。","lines":[{"role":"客户","en":"I need nuts and washers for this **bolt**.","zh":"我要给这支螺栓配螺母和垫圈。"},{"role":"老板","en":"A **hex nut** and a **flat washer**?","zh":"六角螺母和平垫圈吗？"},{"role":"客户","en":"Yes. Do you also have **lock nuts**?","zh":"对。也有锁紧螺母吗？"},{"role":"老板","en":"Yes. Let's check the thread size and the required type.","zh":"有。我们核对一下螺纹尺寸和具体类型。"},{"role":"客户","en":"Can you pack one bolt, one nut, and one washer as a **set**?","zh":"能把一支螺栓、一个螺母和一个垫圈装成一套吗？"},{"role":"老板","en":"Yes. We can put each set in a small bag.","zh":"可以，每套可以装在一个小袋里。"}]},{"id":"d26","number":26,"title":"墙上固定东西，选哪种锚固件","rank":2,"group":"D","scene":"客户想在墙上装搁板，你先问基材，而不是立即拿某种膨胀件。","vocab":"wall plug＝墙塞、塑料膨胀管；expansion anchor＝膨胀锚栓；concrete＝混凝土；brick＝砖；load capacity＝承载能力。","practice":"客户换成 concrete，老板继续问“What will you mount?”，把用途问清。","lines":[{"role":"客户","en":"Should I use a **wall plug** or an **expansion anchor**?","zh":"我该用塑料膨胀管还是膨胀锚栓？"},{"role":"老板","en":"What is the wall made of: **concrete** or **brick**?","zh":"墙是什么材料的，混凝土还是砖？"},{"role":"客户","en":"Brick.","zh":"砖。"},{"role":"老板","en":"Solid or hollow brick? And what will you mount?","zh":"实心砖还是空心砖？您要装什么？"},{"role":"客户","en":"Hollow brick. A shelf.","zh":"空心砖，装一个搁板。"},{"role":"老板","en":"Let's check the fixing requirements and **load capacity** before choosing.","zh":"我们先核对固定要求和承载能力，再选。"}]},{"id":"d27","number":27,"title":"开关柜门，体验缓冲铰链","rank":2,"group":"D","scene":"展示柜装了不同铰链，让客户实际开关柜门。","vocab":"cabinet hinge＝橱柜铰链；soft-close＝缓冲闭合的；concealed hinge＝暗铰链；opening angle＝开启角度（补充搭配）；thickness＝厚度。","practice":"真的开关一次柜门，边关边说 soft-close；再问柜门厚度。","lines":[{"role":"老板","en":"Please try this **cabinet hinge**.","zh":"您试试这个橱柜铰链。"},{"role":"客户","en":"It closes slowly. Is it **soft-close**?","zh":"它关得很慢，是缓冲的吗？"},{"role":"老板","en":"Yes. It's a soft-close **concealed hinge**.","zh":"对，是缓冲暗铰链。"},{"role":"客户","en":"What's the **opening angle**?","zh":"开启角度是多少？"},{"role":"老板","en":"This sample is marked one hundred and ten degrees. What door **thickness** do you use?","zh":"这个样品标的是一百一十度。您的柜门多厚？"},{"role":"客户","en":"Eighteen millimeters. I'll bring the cabinet drawing.","zh":"十八毫米。我会把柜子的图纸带来。"}]},{"id":"d28","number":28,"title":"橱柜拉手与安装孔距","rank":2,"group":"D","scene":"客户想替换原来柜门上的拉手，拿着旧件找相同孔距的款式。","vocab":"cabinet handle＝橱柜拉手；hole spacing＝孔距；center-to-center distance＝中心距；overall length＝总长（补充搭配）；match＝匹配。","practice":"指着两孔说 hole spacing，再指两端说 overall length，把两个尺寸分开说。","lines":[{"role":"客户","en":"I want a **cabinet handle** that **matches** this one.","zh":"我想要一个能和这个配套的橱柜拉手。"},{"role":"老板","en":"What's the **hole spacing**?","zh":"孔距是多少？"},{"role":"客户","en":"One hundred and twenty-eight millimeters, I think.","zh":"我想是一百二十八毫米。"},{"role":"老板","en":"Let's measure the **center-to-center distance**.","zh":"我们量一下中心距。"},{"role":"客户","en":"Is that the same as the **overall length**?","zh":"那和总长一样吗？"},{"role":"老板","en":"No. Hole spacing is between the centers of the two fixing holes.","zh":"不一样，孔距是两个安装孔中心之间的距离。"},{"role":"客户","en":"I see. Let's check both.","zh":"明白了，两个都量一下。"}]},{"id":"d29","number":29,"title":"分清整把锁、锁体和锁芯","rank":2,"group":"D","scene":"客户拿坏掉的部件来，说“我需要一把锁”，你把需求问具体。","vocab":"lock＝锁；lock cylinder＝锁芯；lock body＝锁体；key＝钥匙（配套日常词）；replacement＝替换件。","practice":"用旧锁或照片，分别指认 lock、lock body 和 lock cylinder。","lines":[{"role":"客户","en":"I need a **replacement** for this **lock**.","zh":"我要给这把锁找替换件。"},{"role":"老板","en":"The whole lock, or just the **lock cylinder**?","zh":"整把锁，还是只要锁芯？"},{"role":"客户","en":"Just this part, where the **key** goes in.","zh":"只要这个插钥匙的部件。"},{"role":"老板","en":"That's the lock cylinder. Is the **lock body** still working?","zh":"那就是锁芯。锁体还正常吗？"},{"role":"客户","en":"Yes. Can you match the cylinder size?","zh":"正常，你们能配上同尺寸锁芯吗？"},{"role":"老板","en":"Let's check the dimensions and the fixing position.","zh":"我们核对一下尺寸和固定位置。"}]},{"id":"d30","number":30,"title":"拉开抽屉，检查滑轨","rank":2,"group":"D","scene":"客户拉动展示抽屉，询问滑轨的长度和承载。","vocab":"drawer slide＝抽屉滑轨；ball-bearing slide＝滚珠滑轨；soft-close＝缓冲闭合的；load capacity＝承载能力；length＝长度。","practice":"拉开抽屉，说出 slide；再把长度换成你实际卖的规格。","lines":[{"role":"客户","en":"This drawer moves smoothly. Which **drawer slides** are these?","zh":"这个抽屉拉起来很顺，用的是什么滑轨？"},{"role":"老板","en":"These are **ball-bearing slides**.","zh":"这是滚珠滑轨。"},{"role":"客户","en":"Do you have a **soft-close** version?","zh":"有缓冲款吗？"},{"role":"老板","en":"Yes. What **length** do you need?","zh":"有，您要多长的？"},{"role":"客户","en":"Four hundred and fifty millimeters. What about the **load capacity**?","zh":"四百五十毫米，承载能力呢？"},{"role":"老板","en":"Let's check the rating for that length and mounting arrangement.","zh":"我们核对一下这个长度和安装方式对应的额定承载。"}]},{"id":"d31","number":31,"title":"客户拿错了钻头和批头","rank":2,"group":"D","scene":"客户想买拧螺丝用的配件，却指向了钻头盒。","vocab":"drill bit＝钻头；screwdriver bit＝螺丝批头；screw＝螺丝；Phillips＝十字槽；hex key＝内六角扳手。","practice":"将 drill bit、screwdriver bit、hex key 三种实物摆开，让家人随机点名，你拿对物品。","lines":[{"role":"客户","en":"I need this for driving **screws**.","zh":"我要这个来拧螺丝。"},{"role":"老板","en":"This is a **drill bit**, for making holes. Do you mean a **screwdriver bit**?","zh":"这是打孔用的钻头，您是指螺丝批头吗？"},{"role":"客户","en":"Yes, a bit for these screws.","zh":"对，配这些螺丝的批头。"},{"role":"老板","en":"They have a **Phillips** drive. Let's check the bit size.","zh":"它们是十字槽的，我们核对一下批头规格。"},{"role":"客户","en":"And this tool here?","zh":"那这里这个工具呢？"},{"role":"老板","en":"That's a **hex key**, for hex socket screws.","zh":"那是内六角扳手，用于内六角螺丝。"}]},{"id":"d32","number":32,"title":"冲击钻、电锤与电池配置","rank":2,"group":"D","scene":"客户比较两台工具，关心用途和报价中包含什么。","vocab":"hammer drill＝冲击钻；rotary hammer＝电锤；cordless＝充电式、无线的；battery pack＝电池包；charger＝充电器。","practice":"拿自家真实套装，完整说出几台工具、几块电池、几个充电器。","lines":[{"role":"客户","en":"Is this a **hammer drill** or a **rotary hammer**?","zh":"这是冲击钻还是电锤？"},{"role":"老板","en":"This is a hammer drill. The rotary hammer is next to it.","zh":"这是冲击钻，旁边那个是电锤。"},{"role":"客户","en":"Do you have a **cordless** version?","zh":"有充电式的吗？"},{"role":"老板","en":"Yes. What material will you drill into?","zh":"有，您要在什么材料上打孔？"},{"role":"客户","en":"Mostly brick. Does the price include a **battery pack**?","zh":"主要是砖。价格包含电池包吗？"},{"role":"老板","en":"This kit includes two battery packs and one **charger**.","zh":"这套含两个电池包和一个充电器。"},{"role":"客户","en":"Please write that down.","zh":"请把这些写下来。"},{"role":"老板","en":"Certainly. We'll list every item in the kit.","zh":"当然，我们会把套装里每一项都列出来。"}]},{"id":"d33","number":33,"title":"角磨机、切割片和磨片","rank":2,"group":"D","scene":"看静态样机和磨片包装，客户说明自己是要切割还是打磨。","vocab":"angle grinder＝角磨机；cutting disc＝切割片；grinding disc＝磨片；flap disc＝百叶片；safety glasses＝防护眼镜。","practice":"把三个磨片名称分别对应到实物，不把 cutting 和 grinding 混用。","lines":[{"role":"客户","en":"I need discs for this **angle grinder**.","zh":"我要配这台角磨机的磨片。"},{"role":"老板","en":"For cutting or grinding?","zh":"用来切割还是打磨？"},{"role":"客户","en":"Both.","zh":"两种都要。"},{"role":"老板","en":"Let's look at the **cutting discs** and **grinding discs** separately.","zh":"我们分别看一下切割片和磨片。"},{"role":"客户","en":"What's this one?","zh":"这个是什么？"},{"role":"老板","en":"It's a **flap disc**. We need to check the material, size, and speed rating for your machine.","zh":"这是百叶片。我们要核对加工材料、尺寸，以及与机器匹配的额定转速。"},{"role":"客户","en":"Do you also supply **safety glasses**?","zh":"你们也供应防护眼镜吗？"},{"role":"老板","en":"Yes. They're on this display.","zh":"有，在这个展示架上。"}]},{"id":"d34","number":34,"title":"找扳手、钳子和组套工具","rank":2,"group":"D","scene":"客户要给维修工配一套工具，你打开工具箱让他选。","vocab":"wrench＝扳手；adjustable wrench＝活动扳手；pliers＝钳子；socket set＝套筒组套；metric＝公制的。","practice":"从工具箱拿出三种工具，用 “I'd like… and…” 连续报出采购清单。","lines":[{"role":"客户","en":"I need some **wrenches** and **pliers** for a repair kit.","zh":"我要配维修工具包，需要一些扳手和钳子。"},{"role":"老板","en":"Would you like an **adjustable wrench**?","zh":"要活动扳手吗？"},{"role":"客户","en":"Yes, and a **socket set**.","zh":"要，再加一套套筒。"},{"role":"老板","en":"**Metric** or imperial sizes?","zh":"要公制规格还是英制规格？"},{"role":"客户","en":"Metric. Do you have long-nose pliers too?","zh":"公制。也有尖嘴钳吗？"},{"role":"老板","en":"Yes. Try the grip on this pair.","zh":"有，您握握这一把，感受一下手柄。"}]},{"id":"d35","number":35,"title":"弯头、三通、直接和活接","rank":2,"group":"E","scene":"客户把管路草图摊在桌上，你们用样品在图上比位置。","vocab":"pipe fitting＝管件；elbow＝弯头；tee＝三通；coupling＝直接、管箍；union＝活接；reducer＝异径接头。","practice":"用手臂弯曲比画 elbow，用两手组成 T 形比画 tee，再拿实物区分 coupling 与 union。","lines":[{"role":"客户","en":"I need these **pipe fittings**.","zh":"我需要这些管件。"},{"role":"老板","en":"Let's go through the drawing. Two **elbows** here?","zh":"我们看一下图，这里是两个弯头吗？"},{"role":"客户","en":"Yes, and a **tee** at this point.","zh":"对，这个位置再加一个三通。"},{"role":"老板","en":"Is this straight connection a **coupling** or a **union**?","zh":"这里这个直线连接处用直接还是活接？"},{"role":"客户","en":"A union. We need to take it apart later.","zh":"活接，以后需要拆开。"},{"role":"老板","en":"Are the pipes the same size on both sides?","zh":"两边管子的尺寸一样吗？"},{"role":"客户","en":"No. We need a **reducer** over here.","zh":"不一样，这里需要一个异径接头。"},{"role":"老板","en":"All right. Please mark the size at each connection.","zh":"好，请把每个连接处的尺寸标出来。"}]},{"id":"d36","number":36,"title":"阀门的用途与工作压力","rank":2,"group":"E","scene":"客户在阀门展示架前，手里拿着两个不同类型的阀门。","vocab":"ball valve＝球阀；check valve＝止回阀；working pressure＝工作压力；pressure gauge＝压力表；leak test＝密封性试验。","practice":"指着球阀提问“What working pressure do you need?”，不要只问管径。","lines":[{"role":"客户","en":"Is this a **ball valve**?","zh":"这是球阀吗？"},{"role":"老板","en":"Yes. This other one is a **check valve**.","zh":"对，另一个是止回阀。"},{"role":"客户","en":"I need a valve to shut off the water.","zh":"我要用来关断水流的阀门。"},{"role":"老板","en":"What **working pressure** and temperature do you need?","zh":"您要求的工作压力和温度是多少？"},{"role":"客户","en":"The pressure is shown on this **pressure gauge** in the photo.","zh":"压力显示在照片中的这块压力表上。"},{"role":"老板","en":"Please also confirm the system's required pressure range.","zh":"还请确认系统要求的压力范围。"},{"role":"客户","en":"Do you carry out a **leak test**?","zh":"你们做密封性试验吗？"},{"role":"老板","en":"Yes. Let's check the test method and acceptance criteria for this model.","zh":"做。我们核对一下这个型号的试验方法和验收标准。"}]},{"id":"d37","number":37,"title":"看水龙头，问材质和阀芯","rank":2,"group":"E","scene":"客户在龙头展示台上转动手柄，比较厨房款和面盆款。","vocab":"faucet＝水龙头；kitchen faucet＝厨房龙头；basin faucet＝面盆龙头；brass＝黄铜；ceramic cartridge＝陶瓷阀芯；aerator＝起泡器。","practice":"用手指主体、手柄下的阀芯位置和出水口，分别说 body、cartridge、aerator。","lines":[{"role":"客户","en":"Is this a **kitchen faucet**?","zh":"这是厨房龙头吗？"},{"role":"老板","en":"Yes. The shorter one next to it is a **basin faucet**.","zh":"对，旁边较矮的是面盆龙头。"},{"role":"客户","en":"What is the body made of?","zh":"主体是什么材质？"},{"role":"老板","en":"This model has a **brass** body.","zh":"这个型号的主体是黄铜。"},{"role":"客户","en":"Does it have a **ceramic cartridge**?","zh":"用的是陶瓷阀芯吗？"},{"role":"老板","en":"Yes. Here's a cutaway sample so you can see it.","zh":"是的，这里有个剖面样品，您可以看看。"},{"role":"客户","en":"Can the **aerator** be replaced?","zh":"起泡器可以更换吗？"},{"role":"老板","en":"Yes. We can check the replacement size here.","zh":"可以，我们在这里核对一下替换件尺寸。"}]},{"id":"d38","number":38,"title":"花洒套装里到底含什么","rank":2,"group":"E","scene":"客户看到展示墙上一整套花洒，想知道报价是否包含全部配件。","vocab":"shower set＝花洒套装；hand shower＝手持花洒；shower hose＝花洒软管；bracket＝支架；floor drain＝地漏；separately＝单独地（配套词）。","practice":"用“What comes with this set?”询问另一种套装，逐件说明含与不含的东西。","lines":[{"role":"客户","en":"What comes with this **shower set**?","zh":"这套花洒包含什么？"},{"role":"老板","en":"A **hand shower**, a **shower hose**, and a wall **bracket**.","zh":"一个手持花洒、一根花洒软管和一个墙面支架。"},{"role":"客户","en":"How long is the hose?","zh":"软管多长？"},{"role":"老板","en":"One point five meters.","zh":"一点五米。"},{"role":"客户","en":"Is that **floor drain** included too?","zh":"那个地漏也包含吗？"},{"role":"老板","en":"No, that's sold **separately**.","zh":"不包含，那个单独卖。"}]},{"id":"d39","number":39,"title":"电线的芯数与横截面积","rank":2,"group":"E","scene":"客户拿着一段剥开外护套的电缆样品，看内部导线。","vocab":"cable＝电缆；core＝芯；cross-sectional area＝横截面积；copper conductor＝铜导体；insulation＝绝缘层；sheath＝护套。","practice":"指着剖面数芯数，再分别指出 insulation 和 sheath；把 mm² 读成 square millimeters。","lines":[{"role":"客户","en":"How many **cores** does this **cable** have?","zh":"这根电缆有几芯？"},{"role":"老板","en":"Three. What **cross-sectional area** do you need for each conductor?","zh":"三芯，您要每根导体的横截面积多大？"},{"role":"客户","en":"Two point five square millimeters.","zh":"二点五平方毫米。"},{"role":"老板","en":"And do you require a **copper conductor**?","zh":"您要求铜导体吗？"},{"role":"客户","en":"Yes. What about the **insulation**?","zh":"对。绝缘层呢？"},{"role":"老板","en":"Let's check the specification. This outer layer is the **sheath**.","zh":"我们核对一下规格。这最外面一层是护套。"},{"role":"客户","en":"Please list the conductor material, insulation, and sheath clearly.","zh":"请把导体材料、绝缘层和护套都列清楚。"},{"role":"老板","en":"Certainly. We'll also confirm the required cable standard.","zh":"当然，我们也会确认要求采用的电缆标准。"}]},{"id":"d40","number":40,"title":"插头、插座和电压是否配套","rank":2,"group":"E","scene":"客户拿自己的插头来比对排插，你先核对目的市场和电气参数。","vocab":"plug＝插头；socket outlet＝插座；power strip＝排插；voltage＝电压；frequency＝频率；grounding＝接地。","practice":"按“国家—插头制式—电压—频率”的顺序，口头问一遍自家电器产品的使用条件。","lines":[{"role":"客户","en":"Will this **plug** fit your **power strip**?","zh":"这个插头能配你们的排插吗？"},{"role":"老板","en":"Let's check the **socket outlet** type. Which country is it for?","zh":"我们核对一下插座制式，是哪个国家用的？"},{"role":"客户","en":"For our market in [country].","zh":"用在我们 [国家] 的市场。"},{"role":"老板","en":"What **voltage** and **frequency** are required?","zh":"要求的电压和频率是多少？"},{"role":"客户","en":"They're on this specification sheet. We also need **grounding**.","zh":"在这份规格表上，我们还需要接地。"},{"role":"老板","en":"All right. We'll check the complete requirements, not just the plug shape.","zh":"好，我们会核对完整要求，不只看插头形状。"}]},{"id":"d41","number":41,"title":"现场比较灯光颜色","rank":2,"group":"E","scene":"展示台上两盏灯同时亮着，客户挑选灯光颜色。","vocab":"LED bulb＝LED 灯泡；color temperature＝色温；warm white＝暖白光（补充搭配）；power＝功率。","practice":"指着家里或店里的灯练习问色温和功率，分清 K 与 W 不是同一项参数。","lines":[{"role":"客户","en":"I like this **LED bulb**. What's the **color temperature**?","zh":"我喜欢这个 LED 灯泡，色温是多少？"},{"role":"老板","en":"Three thousand kelvin. We call this **warm white**.","zh":"三千开尔文，我们称这种为暖白光。"},{"role":"客户","en":"And what's the **power**?","zh":"功率呢？"},{"role":"老板","en":"Nine watts. Let's check the label together.","zh":"九瓦，我们一起看一下标签。"}]},{"id":"d42","number":42,"title":"瓷砖按片买还是按平方米买","rank":2,"group":"E","scene":"客户拿着一块地砖，询问尺寸和价格。","vocab":"floor tile＝地砖；porcelain tile＝瓷质砖；square meter＝平方米；piece＝片、件；tile grout＝瓷砖填缝料。","practice":"拿自家真实包装，说出单片尺寸、每箱片数和每箱对应面积，不把三者混在一起。","lines":[{"role":"客户","en":"Is this a **floor tile**?","zh":"这是地砖吗？"},{"role":"老板","en":"Yes, it's a **porcelain tile**, six hundred by six hundred millimeters.","zh":"对，是瓷质地砖，六百乘六百毫米。"},{"role":"客户","en":"Is the price per **piece** or per **square meter**?","zh":"价格是按片还是按平方米？"},{"role":"老板","en":"Per square meter.","zh":"按平方米。"},{"role":"客户","en":"How many pieces come in a box?","zh":"一盒有几片？"},{"role":"老板","en":"Four pieces. They cover one point four four square meters.","zh":"四片，对应一点四四平方米。"},{"role":"客户","en":"Do you have matching **tile grout**?","zh":"有配套颜色的瓷砖填缝料吗？"},{"role":"老板","en":"Yes. Let's compare the grout color samples.","zh":"有，我们比较一下填缝料的色样。"}]},{"id":"d43","number":43,"title":"胶合板、MDF 与板材厚度","rank":2,"group":"E","scene":"客户摸着板材断面，比较内部结构和饰面。","vocab":"plywood＝胶合板；MDF＝中密度纤维板；solid wood＝实木；thickness＝厚度；sheet＝张、板；veneer＝木皮。","practice":"看板材断面说出 plywood 或 MDF，再用 “millimeters thick” 描述厚度。","lines":[{"role":"客户","en":"Is this **solid wood**?","zh":"这是实木吗？"},{"role":"老板","en":"No. This is **plywood** with a wood **veneer**.","zh":"不是，这是贴木皮的胶合板。"},{"role":"客户","en":"And the board next to it?","zh":"旁边那块板呢？"},{"role":"老板","en":"That's **MDF**. You can compare the edges here.","zh":"那是中密度纤维板，您可以在这里比较断面。"},{"role":"客户","en":"What **thicknesses** do you supply?","zh":"你们供应哪些厚度？"},{"role":"老板","en":"We have several options. What thickness and **sheet** size do you need?","zh":"有几种选择。您要多厚、每张板多大的？"}]},{"id":"d44","number":44,"title":"钢材和金属网怎样描述","rank":2,"group":"E","scene":"客户拿着工程材料清单，到钢材样品架前逐项确认。","vocab":"square hollow section＝方形空心型材、方管；wall thickness＝壁厚；galvanized＝镀锌的；welded wire mesh＝电焊网；mesh opening＝网孔尺寸；wire diameter＝丝径。","practice":"先指一个网孔说 mesh opening，再指一根丝说 wire diameter，分别报尺寸。","lines":[{"role":"客户","en":"I need this **square hollow section**.","zh":"我需要这种方管。"},{"role":"老板","en":"What size and **wall thickness**?","zh":"要什么边长和壁厚？"},{"role":"客户","en":"Fifty by fifty millimeters. The wall thickness is on this drawing.","zh":"五十乘五十毫米，壁厚在这张图纸上。"},{"role":"老板","en":"Do you need it **galvanized**?","zh":"需要镀锌吗？"},{"role":"客户","en":"Yes. I also need **welded wire mesh**.","zh":"需要，还要电焊网。"},{"role":"老板","en":"What's the **mesh opening**?","zh":"网孔尺寸是多少？"},{"role":"客户","en":"Fifty by fifty millimeters.","zh":"五十乘五十毫米。"},{"role":"老板","en":"And the **wire diameter**?","zh":"丝径呢？"},{"role":"客户","en":"Three millimeters.","zh":"三毫米。"},{"role":"老板","en":"Thanks. Let's confirm the material standard and coating requirements too.","zh":"谢谢。我们也确认一下材料标准和镀层要求。"}]},{"id":"d45","number":45,"title":"密封胶、涂料和固化时间","rank":2,"group":"E","scene":"客户在辅材区拿起一支胶，又指向旁边的涂料桶。","vocab":"silicone sealant＝硅酮密封胶；adhesive＝胶粘剂；curing time＝固化时间；paint＝涂料；primer＝底漆；coverage＝覆盖面积、涂布率。","practice":"指胶说 curing time，指漆说 coverage；再用“用在哪里”把性能问题问具体。","lines":[{"role":"客户","en":"Is this an **adhesive**?","zh":"这是胶粘剂吗？"},{"role":"老板","en":"It's a **silicone sealant**. What will you use it for?","zh":"这是硅酮密封胶，您要用来做什么？"},{"role":"客户","en":"Sealing the joints around a basin. What's the **curing time**?","zh":"密封面盆周边的接缝，固化时间多长？"},{"role":"老板","en":"Let's check the data sheet for the joint size and conditions.","zh":"我们按接缝大小和使用条件核对一下技术数据表。"},{"role":"客户","en":"And this **paint**—do I need a **primer**?","zh":"那这种涂料呢，需要底漆吗？"},{"role":"老板","en":"What's the surface material, and how much area will you paint?","zh":"基面是什么材料，您要涂多大面积？"},{"role":"客户","en":"A plastered wall, about forty square meters.","zh":"抹灰墙面，大约四十平方米。"},{"role":"老板","en":"Let's check the recommended system and **coverage** on the product sheet.","zh":"我们看一下产品资料上的建议配套体系和涂布率。"}]},{"id":"d46","number":46,"title":"看屋面板、防水和保温样品","rank":2,"group":"E","scene":"客户带来仓库屋顶的照片，在样品架前比较不同材料。","vocab":"roofing sheet＝屋面板；waterproofing membrane＝防水卷材；thermal insulation＝保温、隔热；rock wool＝岩棉；sandwich panel＝夹芯板；thickness＝厚度。","practice":"把三种样品按“屋面板—防水—保温”摆好，边指边说三个英文名称。","lines":[{"role":"客户","en":"We need **roofing sheets** for a warehouse.","zh":"我们给仓库采购屋面板。"},{"role":"老板","en":"Do you have a drawing of the roof build-up?","zh":"您有屋面各层构造的图纸吗？"},{"role":"客户","en":"Yes. It includes a **waterproofing membrane** and **thermal insulation**.","zh":"有，里面包括防水卷材和保温层。"},{"role":"老板","en":"What insulation material is specified?","zh":"图纸要求什么保温材料？"},{"role":"客户","en":"**Rock wool**. Do you supply that?","zh":"岩棉，你们供应吗？"},{"role":"老板","en":"Yes. We also supply rock wool **sandwich panels**.","zh":"供应，我们也供应岩棉夹芯板。"},{"role":"客户","en":"Let's compare them, but keep to the project requirements.","zh":"我们比较看看，但要符合项目要求。"},{"role":"老板","en":"Certainly. Let's start with the required **thickness** and performance.","zh":"当然，我们先看要求的厚度和性能。"}]},{"id":"d47","number":47,"title":"问单价和起订量","rank":3,"group":"F","scene":"客户挑好样品，坐在桌边拿计算器问价。","vocab":"unit price＝单价；per piece＝每件；minimum order quantity / MOQ＝最低起订量；item＝品项；US dollar＝美元。","practice":"拿一个真实产品，用一句话说全“币种—单价—计价单位—适用数量”。","lines":[{"role":"客户","en":"What's the **unit price** for this handle?","zh":"这个把手单价多少？"},{"role":"老板","en":"Two **US dollars per piece**, for an order of five hundred pieces.","zh":"订五百件时，每件两美元。"},{"role":"客户","en":"What's your **minimum order quantity**?","zh":"最低起订量是多少？"},{"role":"老板","en":"Five hundred pieces per **item** for this range.","zh":"这个系列每个品项五百件起订。"},{"role":"客户","en":"Does that mean five hundred in each finish?","zh":"是指每种表面处理都要五百件吗？"},{"role":"老板","en":"Yes, at that price. Let me show you the options for smaller quantities.","zh":"对，这个价格对应每种五百件。我再给您看看小数量的选择。"}]},{"id":"d48","number":48,"title":"客户说贵，商量数量折扣","rank":3,"group":"F","scene":"客户觉得报价高，你不急着降价，先比较条件，再讨论数量。","vocab":"discount＝折扣；target price＝目标价；quantity＝数量；finish＝表面处理；packaging＝包装；volume discount＝数量折扣；quotation＝报价。","practice":"用自家商品的真实数量条件谈一次折扣；先确认比较条件相同，再说价格。","lines":[{"role":"客户","en":"Your price is a little high. Can you offer a **discount**?","zh":"你们价格有点高，能优惠吗？"},{"role":"老板","en":"What's your **target price**?","zh":"您的目标价是多少？"},{"role":"客户","en":"One dollar per piece. Another supplier quoted that.","zh":"每件一美元，另一家供应商报了这个价。"},{"role":"老板","en":"Is that for the same material, **finish**, and **packaging**?","zh":"那是相同材质、表面处理和包装的价格吗？"},{"role":"客户","en":"I need to check the packaging. Your price is one dollar twenty, right?","zh":"包装我得核实一下。你们的价格是一美元二十美分，对吧？"},{"role":"老板","en":"Yes, for a thousand pieces. What **quantity** are you considering?","zh":"对，订一千件是这个价格。您考虑订多少？"},{"role":"客户","en":"Maybe five thousand.","zh":"可能五千件。"},{"role":"老板","en":"At five thousand, we can offer a five percent **volume discount**.","zh":"五千件的话，我们可以给百分之五的数量折扣。"},{"role":"客户","en":"So what's the new unit price?","zh":"那新的单价是多少？"},{"role":"老板","en":"One dollar and fourteen cents per piece, with the same specifications.","zh":"在规格不变的情况下，每件一美元十四美分。"},{"role":"客户","en":"Let me work out the total.","zh":"我算一下总金额。"},{"role":"老板","en":"Of course. I'll write the details on the **quotation**.","zh":"好的，我把详细条件写在报价单上。"}]},{"id":"d49","number":49,"title":"多个款式混批，先做试单","rank":3,"group":"F","scene":"客户第一次合作，希望多选几个款式，每款少买一些。","vocab":"trial order＝试订单；mixed order＝混合订单、混批；model＝型号；in stock＝有现货；MOQ＝最低起订量。","practice":"指三款真实产品，说清哪款 in stock、哪款需要生产，不把混批理解成所有款都没有起订量。","lines":[{"role":"客户","en":"Can we start with a small **trial order**?","zh":"我们能先做一个小试单吗？"},{"role":"老板","en":"Which **models** are you interested in?","zh":"您对哪些型号感兴趣？"},{"role":"客户","en":"These three. Can I place a **mixed order**?","zh":"这三种，能混批吗？"},{"role":"老板","en":"These two are **in stock**. The third needs to be produced.","zh":"这两种有现货，第三种需要生产。"},{"role":"客户","en":"Could I take a hundred of each stock item?","zh":"两种现货能每种拿一百件吗？"},{"role":"老板","en":"We can do that for the stock items. The **MOQ** for the third model is five hundred.","zh":"现货这两种可以。第三种型号的最低起订量是五百件。"},{"role":"客户","en":"Then let's start with the two stock items.","zh":"那我们先订这两种现货。"},{"role":"老板","en":"All right. Let's confirm the finishes and packing.","zh":"好，我们确认一下表面处理和包装。"}]},{"id":"d50","number":50,"title":"客户想带走样品","rank":3,"group":"F","scene":"客户会面结束前，想带样品回去给同事看。","vocab":"sample＝样品；free sample＝免费样品；sample fee＝样品费；label＝标签；item number＝货号。","practice":"给三件样品做英文纸标签，交给家人，看他能否把样品和目录货号对应起来。","lines":[{"role":"客户","en":"Can I take these **samples** with me?","zh":"我能把这些样品带走吗？"},{"role":"老板","en":"You can take the small ones as **free samples**.","zh":"这些小件可以免费拿样。"},{"role":"客户","en":"What about this larger set?","zh":"那这套大一点的呢？"},{"role":"老板","en":"There's a **sample fee** of ten dollars for that set.","zh":"那套的样品费是十美元。"},{"role":"客户","en":"That's fine. Could you **label** each sample?","zh":"可以，能给每个样品贴标签吗？"},{"role":"老板","en":"Certainly. I'll write the **item number**, material, and finish.","zh":"当然，我会写上货号、材质和表面处理。"}]},{"id":"d51","number":51,"title":"在实物上确认标识和包装","rank":3,"group":"F","scene":"客户带了一张品牌图样，你们指着样品讨论印在哪里。","vocab":"logo＝标识、商标图样；laser marking＝激光打标；private label＝客户自有品牌、贴牌；color box＝彩盒；artwork＝设计稿；approval＝确认、批准。","practice":"用一张纸画标识位置，再用 here、smaller、larger 现场调整位置和大小。","lines":[{"role":"客户","en":"Can you put our **logo** on the handle?","zh":"能在把手上做我们的标识吗？"},{"role":"老板","en":"Yes. Would you like **laser marking** here?","zh":"可以，您想在这里激光打标吗？"},{"role":"客户","en":"Yes, but a little smaller.","zh":"对，但小一点。"},{"role":"老板","en":"Like this size?","zh":"这个大小可以吗？"},{"role":"客户","en":"That's better. We also want **private-label** packaging.","zh":"这样更好。包装也想用我们的自有品牌。"},{"role":"老板","en":"A **color box** with your logo?","zh":"带您标识的彩盒吗？"},{"role":"客户","en":"Exactly. Can we check a sample before printing?","zh":"对，印刷前能先看样吗？"},{"role":"老板","en":"Yes. We'll prepare the **artwork** and a sample for your **approval**.","zh":"可以，我们会准备设计稿和样品供您确认。"}]},{"id":"d52","number":52,"title":"二十天交货，是到哪个节点","rank":3,"group":"F","scene":"客户看着日历，问下单后多久能拿到货。","vocab":"lead time＝供货周期；production＝生产；calendar day＝自然日；working day＝工作日；cargo ready date＝货好日期；transit time＝在途运输时间。","practice":"用手指日历说明起算点和终点，把“生产时间”与“到达时间”分成两句话说。","lines":[{"role":"客户","en":"What's the **lead time**?","zh":"供货周期多长？"},{"role":"老板","en":"**Production** takes about twenty days after payment and specification approval.","zh":"付款和规格确认后，生产大约二十天。"},{"role":"客户","en":"Twenty **working days**?","zh":"二十个工作日？"},{"role":"老板","en":"Twenty **calendar days**.","zh":"二十个自然日。"},{"role":"客户","en":"Does that mean the goods arrive at my warehouse in twenty days?","zh":"是指二十天后货到我的仓库吗？"},{"role":"老板","en":"No, that's the time until the goods are ready here. **Transit time** is separate.","zh":"不是，指的是货物在我们这里备妥的时间，运输时间另算。"},{"role":"客户","en":"Then I need to check the shipping schedule too.","zh":"那我还需要核对运输安排。"},{"role":"老板","en":"Yes. Let's agree on the **cargo ready date** first.","zh":"对，我们先确认货好日期。"}]},{"id":"d53","number":53,"title":"当面说明预付款和尾款","rank":3,"group":"F","scene":"客户准备下试单，你们坐在桌边看形式发票上的付款栏。","vocab":"payment terms＝付款条件；advance payment＝预付款；balance＝尾款；bank transfer＝银行转账；pro forma invoice＝形式发票；confirm＝确认。","practice":"不背固定比例，换成你们实际协商的条件，分别说清“多少、什么时候、怎么付”。","lines":[{"role":"客户","en":"What are your **payment terms**?","zh":"你们的付款条件是什么？"},{"role":"老板","en":"For this order, we propose a thirty percent **advance payment**.","zh":"这笔订单我们提议预付百分之三十。"},{"role":"客户","en":"And the **balance**?","zh":"尾款呢？"},{"role":"老板","en":"Before shipment, after the agreed inspection.","zh":"约定的验货完成后、发货前支付。"},{"role":"客户","en":"By **bank transfer**?","zh":"通过银行转账吗？"},{"role":"老板","en":"Yes. Let's put the details on the **pro forma invoice**.","zh":"对，我们把详细条件写在形式发票上。"},{"role":"客户","en":"Can we go through it together before I sign?","zh":"签字前可以一起逐项看一下吗？"},{"role":"老板","en":"Of course. Let's **confirm** the quantities, prices, payment terms, and dates.","zh":"当然，我们核对数量、价格、付款条件和日期。"}]},{"id":"d54","number":54,"title":"讨论内盒、外箱和托盘","rank":3,"group":"G","scene":"桌上放着袋装、盒装和外箱样品，客户选择包装方式。","vocab":"polybag＝塑料袋；inner box＝内盒；carton＝纸箱；pallet＝托盘；label＝标签；shipping marks＝运输唛头。","practice":"实际做一遍“袋—内盒—外箱—托盘”的装包动作，每到一层就说出英文。","lines":[{"role":"客户","en":"How do you pack these fittings?","zh":"这些管件怎么包装？"},{"role":"老板","en":"Each piece goes in a **polybag**, then into an **inner box**.","zh":"每件装一个塑料袋，再装入内盒。"},{"role":"客户","en":"How many inner boxes per **carton**?","zh":"每个外箱装几个内盒？"},{"role":"老板","en":"Ten. Would you like the cartons on **pallets**?","zh":"十个。纸箱要打托吗？"},{"role":"客户","en":"Yes. Can you put our item number on each **label**?","zh":"要。每张标签上能写我们的货号吗？"},{"role":"老板","en":"Certainly. What **shipping marks** do you need on the outer cartons?","zh":"当然，外箱需要什么运输唛头？"},{"role":"客户","en":"I'll write them here, next to the sample label.","zh":"我写在这里，放在样品标签旁边。"},{"role":"老板","en":"Good. Let's keep this packing sample for reference.","zh":"好，我们留着这个包装样品作参照。"}]},{"id":"d55","number":55,"title":"与客户和货代讨论提货","rank":2,"group":"G","scene":"客户带货代来仓库，三人讨论运输安排。这里练习口头确认，不展开合同术语的完整责任划分。","vocab":"freight forwarder＝货代；sea freight＝海运；FCL＝整箱运输；LCL＝拼箱运输；container＝集装箱；loading＝装货；transit time＝在途运输时间。","practice":"三人分别扮演老板、客户、货代，至少问清货物尺寸重量、提货时间和运输时间。","lines":[{"role":"客户","en":"This is our **freight forwarder**, Alex.","zh":"这位是我们的货代 Alex。"},{"role":"老板","en":"Nice to meet you. We're planning **sea freight**, correct?","zh":"很高兴见到您。我们计划走海运，对吗？"},{"role":"货代","en":"Correct. Are you booking **FCL** or **LCL**?","zh":"对，你们订整箱还是拼箱？"},{"role":"客户","en":"We're not sure. Will the order fill a **container**?","zh":"还不确定，这批订单能装满一个集装箱吗？"},{"role":"老板","en":"Let's check the final packing dimensions and weight first.","zh":"我们先核对最终包装尺寸和重量。"},{"role":"货代","en":"Then I can compare the shipping options.","zh":"然后我可以比较运输方案。"},{"role":"客户","en":"What about the **transit time**?","zh":"在途运输时间呢？"},{"role":"货代","en":"I'll check the sailing schedule for your destination.","zh":"我核对一下去您目的地的船期。"},{"role":"老板","en":"Please also confirm the pickup time and **loading** arrangements.","zh":"也请确认提货时间和装货安排。"},{"role":"货代","en":"Certainly. Let's check access to the loading area.","zh":"好，我们看看装货区的车辆通行条件。"}]},{"id":"d56","number":56,"title":"在仓库数箱、称重","rank":3,"group":"G","scene":"两个托盘放在仓库，你和客户一起核对箱数与重量标签。","vocab":"warehouse＝仓库；pallet＝托盘；carton＝纸箱；quantity＝数量；net weight＝净重；gross weight＝毛重。","practice":"指两张纸分别说 net weight 和 gross weight，再说“几托、几箱、每箱几件、总共几件”。","lines":[{"role":"老板","en":"This is your order in our **warehouse**.","zh":"这是在我们仓库里的您这批货。"},{"role":"客户","en":"How many **cartons** are there?","zh":"一共有多少箱？"},{"role":"老板","en":"Twenty-four cartons on two **pallets**.","zh":"两个托盘上共二十四箱。"},{"role":"客户","en":"And the **quantity** per carton?","zh":"每箱数量呢？"},{"role":"老板","en":"Five hundred pieces. Twelve thousand pieces in total.","zh":"五百件，总共一万两千件。"},{"role":"客户","en":"Does this weight label show the **net weight**?","zh":"这个重量标签显示的是净重吗？"},{"role":"老板","en":"This line is the net weight. The next line is the **gross weight**, including the carton and packing.","zh":"这一行是净重，下一行是毛重，包含纸箱和包装材料。"},{"role":"客户","en":"Let's check the pallet weights separately too.","zh":"我们也把托盘包装后的重量另外核对一下。"}]},{"id":"d57","number":57,"title":"参观生产线和质检工位","rank":2,"group":"G","scene":"老板陪同客户到合作工厂，由工厂主管介绍生产与检查流程。","vocab":"production line＝生产线；batch＝批次；quality control / QC＝品控；inspection＝检验；test report＝测试报告；safety helmet＝安全帽。","practice":"在门店或仓库画一条简化流程，边走边介绍“这里生产、这里检查、这里包装”。","lines":[{"role":"老板","en":"This is our partner factory. Please put on a **safety helmet** before we enter.","zh":"这是我们的合作工厂，进去前请戴好安全帽。"},{"role":"客户","en":"Of course. Which **production line** makes these parts?","zh":"当然，这些零件是哪条生产线做的？"},{"role":"主管","en":"This line here. This **batch** is for another order.","zh":"这边这条线。这一批是另一笔订单的。"},{"role":"客户","en":"Where do you carry out **quality control**?","zh":"你们在哪里做品控检查？"},{"role":"主管","en":"At several stages. This is the dimensional **inspection** station.","zh":"有几个检查阶段，这里是尺寸检验工位。"},{"role":"老板","en":"Can we see a sample **test report** for this product?","zh":"我们能看看这种产品的测试报告样本吗？"},{"role":"主管","en":"Yes. Let's go to the QC office.","zh":"可以，我们去品控办公室。"}]},{"id":"d58","number":58,"title":"开箱验货，发现划痕与毛刺","rank":2,"group":"G","scene":"出货前，你和客户在验货桌旁开箱，对照确认样检查。","vocab":"inspection＝验货；approved sample＝已确认样品；scratch＝划痕；burr＝毛刺；defect＝缺陷；rework＝返工；inspection report＝检验报告。","practice":"在废样上用便签标出 scratch、burr、dent（凹痕）三个位置，逐项描述。","lines":[{"role":"客户","en":"Can we start the **inspection** now?","zh":"现在能开始验货了吗？"},{"role":"老板","en":"Yes. Here's the **approved sample** and the inspection checklist.","zh":"可以，这是已确认样品和检验清单。"},{"role":"客户","en":"This piece has a **scratch**.","zh":"这件有一道划痕。"},{"role":"老板","en":"I see it. Let's set it aside.","zh":"我看到了，先把它单独放好。"},{"role":"客户","en":"There's also a **burr** around this hole.","zh":"这个孔周围还有毛刺。"},{"role":"老板","en":"Let's record both **defects** and check them against the agreed criteria.","zh":"我们把两种缺陷都记录下来，对照约定标准核查。"},{"role":"客户","en":"Can the affected pieces be **reworked**?","zh":"有问题的这些件能返工吗？"},{"role":"老板","en":"We'll check with the factory and record the action in the **inspection report**.","zh":"我们会和工厂核实，并把处理措施记入检验报告。"}]},{"id":"d59","number":59,"title":"客户带着问题产品来找你","rank":3,"group":"H","scene":"客户再次来访，带来了上一批中关不顺的一个把手组件。","vocab":"problem＝问题（配套日常词）；batch number＝批次号；affected quantity＝受影响数量；warranty＝保修；replacement＝替换品；spare parts＝备件；investigate＝调查、核查。","practice":"客户实际做出“转不动”的动作，老板依次问“批号—数量—安装情况”，最后给明确回复时间。","lines":[{"role":"客户","en":"We have a **problem** with some of the handles.","zh":"有些把手出了问题。"},{"role":"老板","en":"I'm sorry to hear that. Can you show me what happens?","zh":"很遗憾听到这个情况，您能演示一下吗？"},{"role":"客户","en":"This part doesn't move smoothly.","zh":"这个部件转动不顺。"},{"role":"老板","en":"What's the **batch number**, and what's the **affected quantity**?","zh":"批次号是多少，受影响数量是多少？"},{"role":"客户","en":"Batch B-12. We've found twelve pieces so far.","zh":"B-12 批次，目前发现十二件。"},{"role":"老板","en":"Thank you. Let's check the parts and how they were installed.","zh":"谢谢，我们看看部件以及安装情况。"},{"role":"客户","en":"Are they covered by the **warranty**?","zh":"这些在保修范围内吗？"},{"role":"老板","en":"We'll check the warranty terms and **investigate** the cause.","zh":"我们会核对保修条款并调查原因。"},{"role":"客户","en":"Can you provide **replacements** or **spare parts**?","zh":"能提供替换品或者备件吗？"},{"role":"老板","en":"Let's confirm what needs replacing. I'll give you an update tomorrow morning.","zh":"我们先确认需要换什么，明天上午向您更新进展。"}]},{"id":"d60","number":60,"title":"老客户再来，一次谈完补货事项","rank":3,"group":"H","scene":"老客户到展厅补货。这段把前面的词串成一次较完整的会谈，可留到最后练。","vocab":"reorder＝再次订购；feedback＝反馈；finish＝表面处理；in stock＝有现货；production＝生产；lead time＝供货周期；packaging＝包装；unit price＝单价；order confirmation＝订单确认。","practice":"遮住整段英文，只看中文演一次；再换一组产品、颜色、数量和交期，重新谈一遍。","lines":[{"role":"老板","en":"Welcome back! How did the last order sell?","zh":"欢迎再次来访！上批货卖得怎么样？"},{"role":"客户","en":"Quite well. We'd like to **reorder** these handles.","zh":"挺好，我们想再订这些把手。"},{"role":"老板","en":"Great. Any **feedback** from your customers?","zh":"好的，您的客户有什么反馈吗？"},{"role":"客户","en":"They like the quality. This time we'd like two **finishes**.","zh":"他们觉得质量不错，这次想要两种表面处理。"},{"role":"老板","en":"Brushed silver and matte black?","zh":"拉丝银和哑光黑？"},{"role":"客户","en":"Yes. One thousand silver and five hundred black.","zh":"对，一千件银色，五百件黑色。"},{"role":"老板","en":"We have five hundred silver ones **in stock**. The rest need **production**.","zh":"银色有五百件现货，其余需要生产。"},{"role":"客户","en":"What's the **lead time** for the rest?","zh":"其余部分的供货周期多久？"},{"role":"老板","en":"About ten calendar days after we confirm the order details and receive the agreed payment.","zh":"确认订单细节并收到约定款项后，大约十个自然日。"},{"role":"客户","en":"We can wait and collect everything together.","zh":"我们可以等，一起提走。"},{"role":"老板","en":"Do you want the same **packaging** as last time?","zh":"包装和上次一样吗？"},{"role":"客户","en":"Yes, but put our item number on each inner box.","zh":"一样，但每个内盒上加上我们的货号。"},{"role":"老板","en":"No problem. Let's check the label sample here.","zh":"可以，我们在这里核对一下标签样品。"},{"role":"客户","en":"Is the **unit price** still the same?","zh":"单价还是和上次一样吗？"},{"role":"老板","en":"I'll check the price for each finish and the revised quantity.","zh":"我核算一下每种表面处理和新数量对应的价格。"},{"role":"客户","en":"All right. Please list the two finishes separately.","zh":"好，请把两种表面处理分开列。"},{"role":"老板","en":"Certainly. Then we'll go through the **order confirmation** together.","zh":"当然，然后我们一起核对订单确认内容。"},{"role":"客户","en":"Good. Let's write down the collection date too.","zh":"好，把提货日期也写下来。"}]}],"offsets":[1,3,7,15,30]}</script>
  <script>(function (root) {
  'use strict';
  const OFFSETS = [1, 3, 7, 15, 30];
  const DAY = 86400000;
  function today(date = new Date()) {
    return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('-');
  }
  function validDate(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const [y, m, d] = s.split('-').map(Number);
    const date = new Date(Date.UTC(y, m - 1, d));
    return date.getUTCFullYear() === y && date.getUTCMonth() + 1 === m && date.getUTCDate() === d;
  }
  function dayNumber(s) {
    const [y, m, d] = s.split('-').map(Number);
    return Date.UTC(y, m - 1, d) / DAY;
  }
  function addDays(s, n) {
    return new Date((dayNumber(s) + n) * DAY).toISOString().slice(0, 10);
  }
  function elapsed(record, date = today()) { return dayNumber(date) - dayNumber(record.learnedOn); }
  function pending(record) { return !record || record.known ? [] : OFFSETS.filter(n => !(record.passed || []).includes(n)); }
  function dueStages(record, date = today()) { return pending(record).filter(n => n <= elapsed(record, date)); }
  function nextDue(record) {
    const n = pending(record)[0];
    return n === undefined ? null : addDays(record.learnedOn, n);
  }
  function learn(state, id, date = today()) {
    if (state.words[id]) return false;
    state.words[id] = {learnedOn: date, passed: [], reviews: [], lapses: 0};
    return true;
  }
  function recognize(state, id, date = today()) {
    const added = !state.words[id];
    if (added) learn(state, id, date);
    state.words[id].known = true;
    return added;
  }
  function resume(state, id, date = today()) {
    const rec = state.words[id];
    if (!rec || !rec.known) return false;
    state.words[id] = {learnedOn: date, passed: [], reviews: [], lapses: rec.lapses || 0};
    return true;
  }
  function review(state, id, correct, date = today()) {
    const rec = state.words[id];
    if (!rec || !dueStages(rec, date).length) return false;
    if (!correct) { rec.lapses = (rec.lapses || 0) + 1; return false; }
    const stages = dueStages(rec, date);

      u.onerror = e => {
        if (run !== speakingRun) return;
        UI.reading = null;
        updateReadButton();
        if (!['canceled', 'interrupted'].includes(e.error)) toast('当前朗读不可用，可以继续阅读和练习。');
      };
      window.speechSynthesis.speak(u);
    }
    next(0);
  }
  function openSettings() {
    const dialog = $('#settings-dialog');
    dialog.innerHTML = `<div class="modal-head"><h2 id="settings-title">按自己的节奏学</h2><button class="icon-button small-icon" data-action="close-modal" aria-label="关闭设置">${icon('close')}</button></div><div class="modal-body"><section class="setting-group"><label class="setting-label" for="daily-goal">每天的新词小目标</label><p>只是一个温柔的提醒，不限制你继续学习。</p><select id="daily-goal">${[5, 10, 15, 20, 30].map(n => `<option value="${n}" ${state.settings.goal === n ? 'selected' : ''}>每天 ${n} 个新词</option>`).join('')}</select></section><section class="setting-group"><label class="switch-row" for="large-text"><span><span class="setting-label">大字阅读</span><span class="small muted">放大单词、释义和对话文字</span></span><input id="large-text" type="checkbox" ${state.settings.largeText ? 'checked' : ''}></label></section><section class="setting-group"><span class="setting-label">备份你的学习记录</span><p>记录保存在当前设备的这个浏览器里。换手机、换浏览器或换文件位置前，先导出，再在新位置导入。</p><div class="backup-actions"><button class="btn btn-secondary" data-action="export">${icon('download')}导出记录</button><button class="btn btn-secondary" data-action="import">${icon('upload')}导入记录</button></div></section><section class="setting-group"><span class="setting-label">复习怎样安排？</span><p>点“我认识，不用复习”的词计入学习进度，但不会进入复习；也不计入每日新词目标。需要巩固时可在单词卡重新加入。从点“记住了”的那天算起，第 1、3、7、15、30 天自动到期。明天就是第 1 天。逾期不会消失；同一天补复习一次，可合并已到期节点。</p></section><section class="setting-group"><span class="setting-label">关于离线与发音</span><p>全部词汇和对话已放在这个文件里，无需登录或联网。发音使用设备的英文语音，是否可离线朗读取决于系统和浏览器。</p></section><p class="small muted" style="margin-top:15px">27 个章节 · ${DATA.units.length} 个 Unit · 1,052 条词汇 · 60 段对话<br>词性按当前释义标注；多词表达注明短语类型。同一词在不同情境有不同释义时，按各情境条目分别学习。</p></div>`;
    dialog.showModal();
  }
  function exportRecords() {
    const payload = {app: 'hardware-pocket-english', version: 1, exportedAt: new Date().toISOString(), state};
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url;
    a.download = `外贸英语学习记录-${C.today()}.json`;
    ($('#settings-dialog').open ? $('#settings-dialog') : document.body).append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    toast('已生成备份文件，请妥善保存。');
  }
  async function importRecords(file) {
    if (!file) return;
    try {
      if (file.size > 2 * 1024 * 1024) throw new Error('记录文件过大，请选择本页面导出的 JSON 文件');
      const payload = JSON.parse(await file.text());
      if (payload.app !== 'hardware-pocket-english' || payload.version !== 1) throw new Error('请选择本页面导出的学习记录文件');
      UI.importState = C.validateState(payload.state, DATA);
      const dialog = $('#import-dialog');
      dialog.innerHTML = `<div class="modal-head"><h2 id="import-title">恢复学习记录</h2><button class="icon-button small-icon" data-action="close-modal" aria-label="取消导入">${icon('close')}</button></div><div class="modal-body"><div class="note-card"><p>备份中有 <strong>${Object.keys(UI.importState.words).length} 个已学词</strong>，以及 <strong>${Object.keys(UI.importState.dialogueRead).length} 段已读对话</strong>。</p></div><p class="lead" style="margin:18px 0">确认后将替换当前浏览器中的学习记录。需要保留现有进度时，请先取消并导出。</p><button class="btn btn-primary btn-block" data-action="confirm-import">确认恢复这份记录</button><button class="btn btn-secondary btn-block" data-action="close-modal" style="margin-top:10px">取消</button></div>`;
      dialog.showModal();
    } catch (error) { UI.importState = null; toast('无法导入：' + (error.message || '文件格式不正确')); }
    finally { $('#import-file').value = ''; }
  }
  function renderRoute(scroll = true) {
    const [route = 'home', id] = (location.hash.slice(1) || 'home').split('/');
    if (route === 'home') renderHome();
    else if (route === 'learn') renderLearn(id);
    else if (route === 'unit') renderUnit(id);
    else if (route === 'study') renderStudy(id);
    else if (route === 'word') renderStudy(WORD_UNIT.get(id), id);
    else if (route === 'review') renderReview();
    else if (route === 'quiz') renderQuiz();
    else if (route === 'dialogues') renderDialogues();
    else if (route === 'dialogue') renderDialogue(id);
    else notFound();
    updateChrome();
    if (scroll) { window.scrollTo({top: 0, behavior: 'instant'}); main.focus({preventScroll: true}); }
  }
  document.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button || button.disabled) return;
    const {action, id, value, index} = button.dataset;
    if (action === 'settings') openSettings();
    else if (action === 'close-modal') button.closest('dialog').close();
    else if (action === 'speak-word') speak(WORDS.get(id).en);
    else if (action === 'speak-line') speak(DIALOGUES.get(id).lines[Number(index)].en);
    else if (action === 'read-dialogue') readDialogue(id);
    else if (action === 'reveal') { UI.session.revealed = true; renderRoute(false); }
    else if (action === 'study-remember') studyNext('learn');
    else if (action === 'study-known') studyNext('known');
    else if (action === 'restart-study') { UI.session = null; if (location.hash !== '#study/' + id) location.hash = '#study/' + id; else renderRoute(); }
    else if (action === 'learn-filter') { UI.learnFilter = value; renderLearn(); }
    else if (action === 'direction') { mutate(s => { s.settings.direction = value; }); renderReview(); }
    else if (action === 'more-review') { UI.reviewLimit = (UI.reviewLimit || 30) + 30; renderReview(); }
    else if (action === 'start-review') startQuiz();
    else if (action === 'answer') answerQuiz(id);
    else if (action === 'not-sure') answerQuiz(null);
    else if (action === 'next-question') {
      UI.quiz.index++; UI.quiz.answered = false; UI.quiz.options = null; UI.quiz.selected = null; UI.quiz.result = null;
      renderRoute();
    } else if (action === 'dialogue-filter') { UI.dialogueGroup = value; renderDialogues(); }
    else if (action === 'dialogue-display') { UI.dialogueDisplay = value; renderDialogue(location.hash.split('/')[1]); }
    else if (action === 'mark-dialogue') {
      const added = !state.dialogueRead[id];
      mutate(s => { s.dialogueRead[id] = s.dialogueRead[id] || C.today(); });
      button.className = 'btn btn-soft btn-block';
      button.innerHTML = icon('check') + '已读过 · 可以反复练习';
      if (added) toast('已记录这一段的阅读进度。');
    } else if (action === 'export') exportRecords();
    else if (action === 'import') { $('#settings-dialog').close(); $('#import-file').click(); }
    else if (action === 'confirm-import' && UI.importState) {
      state = UI.importState;
      UI.importState = null; UI.session = null; UI.quiz = null;
      saveState();
      $('#import-dialog').close();
      if (location.hash !== '#home') location.hash = '#home'; else renderRoute();
      toast('学习记录已恢复。');
    }
  });
  document.addEventListener('input', event => {
    if (event.target.id === 'learn-search') { UI.learnQuery = event.target.value; renderLearnResults(); }
    if (event.target.id === 'dialogue-search') { UI.dialogueQuery = event.target.value; renderDialogueResults(); }
  });
  document.addEventListener('change', event => {
    if (event.target.id === 'daily-goal') {
      const goal = Number(event.target.value);
      if ([5, 10, 15, 20, 30].includes(goal)) { mutate(s => { s.settings.goal = goal; }); renderRoute(false); }
    }
    if (event.target.id === 'large-text') { mutate(s => { s.settings.largeText = event.target.checked; }); renderRoute(false); }
    if (event.target.id === 'import-file') importRecords(event.target.files[0]);
  });
  document.addEventListener('keydown', event => {
    if (location.hash !== '#quiz' || !UI.quiz || UI.quiz.answered || event.ctrlKey || event.altKey || event.metaKey || document.querySelector('dialog[open]')) return;
    if (/^[1-4]$/.test(event.key) && UI.quiz.options) answerQuiz(UI.quiz.options[Number(event.key) - 1].id);
  });
  window.addEventListener('hashchange', () => {
    stopSpeech();
    if (!/^#(study|word)\//.test(location.hash)) UI.session = null;
    renderRoute();
  });
  window.addEventListener('pagehide', stopSpeech);
  window.addEventListener('storage', event => {
    if (event.key === STORAGE_KEY) { state = loadState(); renderRoute(false); }
  });
  let lastToday = C.today();
  function refreshDate() {
    if (lastToday !== C.today()) { lastToday = C.today(); renderRoute(false); }
  }
  window.addEventListener('focus', refreshDate);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshDate(); });
  setInterval(refreshDate, 30000);
  document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
  renderRoute();
})();
</script>
</body>
</html>
